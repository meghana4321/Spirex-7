
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Converter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Currency Converter</h1>
        <p class="subtitle">Convert currencies instantly</p>

        <div class="input-group">
            <label>Amount</label>
            <input type="number" id="amount" value="1" min="0">
        </div>

        <div class="currency-row">
            <div class="input-group">
                <label>From</label>
                <select id="fromCurrency">
                    <option value="INR">INR - Indian Rupee</option>
                    <option value="USD">USD - US Dollar</option>
                    <option value="EUR">EUR - Euro</option>
                    <option value="GBP">GBP - British Pound</option>
                    <option value="JPY">JPY - Japanese Yen</option>
                    <option value="AUD">AUD - Australian Dollar</option>
                    <option value="CAD">CAD - Canadian Dollar</option>
                    <option value="AED">AED - UAE Dirham</option>
                    <option value="SGD">SGD - Singapore Dollar</option>
                    <option value="CHF">CHF - Swiss Franc</option>
                </select>
            </div>

            <button id="swap" title="Swap currencies">⇄</button>

            <div class="input-group">
                <label>To</label>
                <select id="toCurrency">
                    <option value="USD">USD - US Dollar</option>
                    <option value="INR">INR - Indian Rupee</option>
                    <option value="EUR">EUR - Euro</option>
                    <option value="GBP">GBP - British Pound</option>
                    <option value="JPY">JPY - Japanese Yen</option>
                    <option value="AUD">AUD - Australian Dollar</option>
                    <option value="CAD">CAD - Canadian Dollar</option>
                    <option value="AED">AED - UAE Dirham</option>
                    <option value="SGD">SGD - Singapore Dollar</option>
                    <option value="CHF">CHF - Swiss Franc</option>
                </select>
            </div>
        </div>

        <button id="convertBtn">Convert Currency</button>

        <div class="result">
            <p>Converted Amount</p>
            <h2 id="result">--</h2>
            <p id="rateInfo">Exchange rate will appear here</p>
            <p id="dateInfo"></p>
        </div>

        <p id="error"></p>
    </div>

    <script src="script.js"></script>
</body>
</html>
